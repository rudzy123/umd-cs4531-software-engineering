name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Mypy
        run: mypy src tests

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Pytest
        run: pytest

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag "task-api:${{ github.sha }}" .
      - name: Exercise health endpoint
        run: |
          set -eu
          docker run -d --name task-api -p 8000:8000 "task-api:${{ github.sha }}"
          cleanup() {
            docker logs task-api || true
            docker rm -f task-api >/dev/null
          }
          trap cleanup EXIT
          for _ in $(seq 1 30); do
            if python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"; then
              exit 0
            fi
            sleep 1
          done
          echo "health endpoint did not become ready" >&2
          exit 1
